name: Auto-fill PR Details

# Automatically populates PR details when opened from an ATLAS branch.
# Generates description using GitHub AI Models from diff and issue context,
# links issue, assigns author, copies labels, and adds to the project board.
on:
  pull_request:
    types: [opened, reopened, synchronize]

env:
  PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}

jobs:
  autofill:
    name: Auto-fill PR Details
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    # Skip forked PRs — GITHUB_TOKEN is read-only for forks
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Auto-fill PR metadata and description
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          GITHUB_TOKEN_VALUE: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const branch = pr.head.ref;
            const action = context.payload.action;

            const match = branch.match(/ATLAS-(\d+)/);
            if (!match) {
              console.log("Branch does not follow ATLAS convention — skipping.");
              return;
            }

            const issueNumber = parseInt(match[1], 10);

            // --- Gather issue context ---
            let issueTitle = "";
            let issueBody = "";
            try {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });
              issueTitle = issue.title;
              issueBody = issue.body || "";

              // Copy labels from issue to PR (only on open/reopen)
              if (action !== "synchronize") {
                const labels = issue.labels.map((l) => l.name);
                if (labels.length > 0) {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    labels: labels,
                  });
                }
              }
            } catch (e) {
              console.log("Could not fetch issue: " + e.message);
            }

            // --- Get changed files via paginated API ---
            let prFiles = [];
            try {
              prFiles = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                per_page: 100,
              });
            } catch (e) {
              console.log("Could not fetch PR files: " + e.message);
            }

            // --- Determine if description should be generated ---
            const AUTO_MARKER = "<!-- auto-generated-pr-description -->";
            const currentBody = pr.body || "";

            // Fetch the PR template to detect default/unchanged bodies
            let templateBody = "";
            try {
              const { data: template } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: ".github/pull_request_template.md",
              });
              templateBody = Buffer.from(template.content, "base64").toString().trim();
            } catch (e) {
              // No template — that's fine
            }

            const isEmptyOrTemplate = currentBody.trim() === ""
              || currentBody.includes(AUTO_MARKER)
              || currentBody.trim() === templateBody;

            // On synchronize: only regenerate if file count changed significantly
            if (action === "synchronize") {
              if (!currentBody.includes(AUTO_MARKER)) {
                console.log("Manual description detected — skipping regeneration.");
                return;
              }

              // Check if file count changed since last generation
              const fileCountMatch = currentBody.match(/\*\*Impact:\*\*\n([\s\S]*?)(?=\n##|\nCloses|$)/);
              const previousFileCount = fileCountMatch
                ? (fileCountMatch[1].match(/^- /gm) || []).length
                : 0;

              if (Math.abs(prFiles.length - previousFileCount) < 2) {
                console.log("No significant file changes — skipping regeneration.");
                return;
              }

              console.log("Significant changes detected — regenerating description.");
            }

            if (!isEmptyOrTemplate && action !== "synchronize") {
              // Body has manual edits — only append Closes keyword if missing
              if (!currentBody.includes("Closes #" + issueNumber)) {
                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  body: currentBody + "\n\nCloses #" + issueNumber,
                });
              }
              console.log("PR has manual description — skipping auto-generation.");
            } else {
              // --- Generate description ---
              const fileStat = prFiles
                .map((f) => "`" + f.filename + "` — " + f.status.charAt(0).toUpperCase() + f.status.slice(1) + " (+" + f.additions + ", -" + f.deletions + ")")
                .join("\n- ");

              // Get diff from API for AI context
              let diff = "";
              try {
                const { data: diffData } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  mediaType: { format: "diff" },
                });
                diff = typeof diffData === "string" ? diffData.slice(0, 8000) : "";
              } catch (e) {
                console.log("Could not fetch diff: " + e.message);
              }

              let description = "";

              // Generate description with GitHub AI Models
              try {
                const systemPrompt = [
                  "You generate concise PR descriptions for a GitHub repository.",
                  "Output ONLY the markdown content, no extra commentary.",
                  "Use this exact format:",
                  "",
                  "## Scope",
                  "1-2 sentences describing what this PR does and why.",
                  "",
                  "**Changes:**",
                  "- Bullet points describing each meaningful change (3-5 bullets max)",
                  "",
                  "Do NOT add co-author tags, attribution, or any text outside the format above.",
                ].join("\n");

                const userPrompt = [
                  "Generate a PR description for this pull request.",
                  "",
                  "PR Title: " + pr.title,
                  "Branch: " + branch,
                  "Linked Issue #" + issueNumber + ": " + issueTitle,
                  "",
                  "Issue Description:",
                  issueBody.slice(0, 2000),
                  "",
                  "Changed Files:",
                  fileStat,
                  "",
                  "Diff (truncated):",
                  diff,
                ].join("\n");

                const response = await fetch(
                  "https://models.github.ai/inference/chat/completions",
                  {
                    method: "POST",
                    headers: {
                      "Authorization": "Bearer " + process.env.GITHUB_TOKEN_VALUE,
                      "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                      model: "openai/gpt-4o-mini",
                      messages: [
                        { role: "system", content: systemPrompt },
                        { role: "user", content: userPrompt },
                      ],
                      temperature: 0.3,
                      max_tokens: 1000,
                    }),
                  }
                );

                if (!response.ok) {
                  const errorText = await response.text().catch(() => "unknown");
                  console.log("AI API returned " + response.status + ": " + errorText.slice(0, 500));
                } else {
                  const data = await response.json();
                  if (data.choices && data.choices[0]) {
                    description = data.choices[0].message.content.trim();
                    // Sanitize: remove any co-author tags the model may add
                    description = description.replace(/Co-authored-by:.*$/gim, "").trim();
                  }
                }
              } catch (e) {
                console.log("AI description generation failed: " + e.message);
              }

              // Fallback if AI fails
              if (!description) {
                const overviewMatch = issueBody.match(/## Overview\s*\n([\s\S]*?)(?=\n##|\n- \[|$)/);
                const overview = overviewMatch ? overviewMatch[1].trim() : issueTitle;
                description = "## Scope\n" + overview;
              }

              // Add impact section from file stats
              if (prFiles.length > 0) {
                description += "\n\n**Impact:**\n- " + fileStat;
              }

              // Build final body with marker, linked issue, and closing keyword
              const fullBody = [
                AUTO_MARKER,
                description,
                "",
                "## Linked Issue",
                "**#" + issueNumber + "** — " + issueTitle,
                "",
                "Closes #" + issueNumber,
              ].join("\n");

              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                body: fullBody,
              });

              console.log("PR description auto-generated.");
            }

            // Auto-assign PR to the author (only on open/reopen)
            if (action !== "synchronize") {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                assignees: [pr.user.login],
              });
            }

            console.log("PR #" + pr.number + " metadata auto-filled.");

      # Separate step for project board linking using PAT
      - name: Add PR to project board
        if: env.PROJECT_TOKEN != ''
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const action = context.payload.action;

            // Only link to project on open/reopen
            if (action === "synchronize") return;

            try {
              const mutation = "mutation($projectId: ID!, $contentId: ID!) { addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) { item { id } } }";
              await github.graphql(mutation, {
                projectId: "PVT_kwHOAovKJ84BSU4A",
                contentId: pr.node_id,
              });
              console.log("PR added to project board.");
            } catch (e) {
              console.log("Could not add PR to project board: " + e.message);
            }

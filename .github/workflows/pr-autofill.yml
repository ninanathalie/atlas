name: Auto-fill PR Details

# Automatically populates PR details when opened from an ATLAS branch.
# Generates description from issue context and diff analysis, links issue,
# assigns author, copies labels, and adds to the project board.
on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  autofill:
    name: Auto-fill PR Details
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    # Skip forked PRs — GITHUB_TOKEN is read-only for forks
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Auto-fill PR details from branch
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        with:
          script: |
            const { execSync } = require("child_process");
            const pr = context.payload.pull_request;
            const branch = pr.head.ref;

            // Extract issue number from branch name (e.g., feat/ATLAS-07 → 7)
            const match = branch.match(/ATLAS-(\d+)/);
            if (!match) {
              console.log(`Branch '${branch}' does not follow ATLAS convention — skipping.`);
              return;
            }

            const issueNumber = parseInt(match[1], 10);
            const base = pr.base.ref;

            // --- Gather context ---

            // Get linked issue details (title, body, labels)
            let issueTitle = "";
            let issueBody = "";
            let issueLabels = [];
            try {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });

              issueTitle = issue.title;
              issueBody = issue.body || "";
              issueLabels = issue.labels.map((l) => l.name);

              // Copy labels from issue to PR
              if (issueLabels.length > 0) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  labels: issueLabels,
                });
              }
            } catch (e) {
              console.log(`⚠️ Could not fetch issue #${issueNumber}: ${e.message}`);
            }

            // Get file-level diff stats
            let fileStats = [];
            try {
              const diffStat = execSync(
                `git diff --numstat origin/${base}..HEAD`
              ).toString().trim();

              fileStats = diffStat.split("\n").filter(Boolean).map((line) => {
                const [added, deleted, file] = line.split("\t");
                return { file, added: parseInt(added) || 0, deleted: parseInt(deleted) || 0 };
              });
            } catch (e) {
              console.log("⚠️ Could not read diff stats:", e.message);
            }

            // --- Build Scope section ---

            // Extract the issue overview (first paragraph after "## Overview")
            let scopeSummary = "";
            const overviewMatch = issueBody.match(/## Overview\s*\n([\s\S]*?)(?=\n##|\n- \[|$)/);
            if (overviewMatch) {
              scopeSummary = overviewMatch[1].trim();
            } else {
              // Fallback to issue title
              scopeSummary = issueTitle;
            }

            // --- Build Changes section ---
            // Match completed acceptance criteria or derive from diff

            const changeBullets = [];

            // Try to match changes against acceptance criteria from issue
            const criteriaMatches = issueBody.match(/- \[[ x]\] .+/g) || [];
            const criteria = criteriaMatches.map((c) =>
              c.replace(/- \[[ x]\] /, "").trim()
            );

            // Map changed files/directories to relevant criteria
            const changedDirs = [...new Set(fileStats.map((f) => {
              const parts = f.file.split("/");
              return parts.length > 1 ? parts.slice(0, 2).join("/") : parts[0];
            }))];

            // For each criterion, check if any changed file seems related
            for (const criterion of criteria) {
              const keywords = criterion.toLowerCase().split(/\s+/);
              const isRelevant = changedDirs.some((dir) =>
                keywords.some((kw) => dir.toLowerCase().includes(kw))
              ) || fileStats.some((f) =>
                keywords.some((kw) => f.file.toLowerCase().includes(kw))
              );

              if (isRelevant) {
                changeBullets.push(`- ${criterion}`);
              }
            }

            // If no criteria matched, fall back to describing changes by directory
            if (changeBullets.length === 0) {
              const dirSummary = {};
              for (const f of fileStats) {
                const dir = f.file.split("/").slice(0, 2).join("/");
                if (!dirSummary[dir]) dirSummary[dir] = { added: 0, deleted: 0, count: 0 };
                dirSummary[dir].added += f.added;
                dirSummary[dir].deleted += f.deleted;
                dirSummary[dir].count++;
              }

              for (const [dir, stats] of Object.entries(dirSummary)) {
                const action = stats.deleted === 0 ? "Add" : stats.added > stats.deleted ? "Update" : "Refactor";
                changeBullets.push(`- ${action} \`${dir}\` (${stats.count} file${stats.count > 1 ? "s" : ""}, +${stats.added} -${stats.deleted})`);
              }
            }

            // --- Build Impact section ---
            const impactBullets = fileStats
              .slice(0, 10) // max 10 files
              .map((f) => {
                const action = f.deleted === 0 ? "Added" : f.added > 0 && f.deleted > 0 ? "Modified" : "Removed";
                return `- \`${f.file}\` — ${action} (+${f.added}, -${f.deleted})`;
              });

            // --- Assemble description ---
            let description = `## Scope\n${scopeSummary}\n\n`;

            if (changeBullets.length > 0) {
              description += `**Changes:**\n${changeBullets.join("\n")}\n\n`;
            }

            if (impactBullets.length > 0) {
              description += `**Impact:**\n${impactBullets.join("\n")}\n\n`;
            }

            description += `## Linked Issue\n**#${issueNumber}** — ${issueTitle}\n\n`;
            description += `Closes #${issueNumber}`;

            // Update PR description
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body: description,
            });

            // Auto-assign PR to the author
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              assignees: [pr.user.login],
            });

            // Add PR to ATLAS project board (project #4) using PROJECT_TOKEN
            const projectToken = process.env.PROJECT_TOKEN;
            if (projectToken) {
              try {
                const { graphql } = await import("@octokit/graphql");

                const gql = graphql.defaults({
                  headers: { authorization: `token ${projectToken}` },
                });

                await gql(`mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                    item { id }
                  }
                }`, {
                  projectId: "PVT_kwHOAovKJ84BSU4A",
                  contentId: pr.node_id,
                });

                console.log("✅ PR added to project board.");
              } catch (e) {
                console.log(`⚠️ Could not add PR to project board: ${e.message}`);
              }
            } else {
              console.log("⚠️ PROJECT_TOKEN not set — skipping project board linking.");
            }

            console.log(`✅ PR #${pr.number} auto-filled: description generated, linked to #${issueNumber}, assigned to ${pr.user.login}.`);

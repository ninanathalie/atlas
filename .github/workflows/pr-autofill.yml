name: Auto-fill PR Details

# Automatically populates PR details when opened from an ATLAS branch.
# Generates description using GitHub AI Models from diff and issue context,
# links issue, assigns author, copies labels, and adds to the project board.
on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  autofill:
    name: Auto-fill PR Details
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      models: read

    # Skip forked PRs — GITHUB_TOKEN is read-only for forks
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Auto-fill PR details from branch
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          PROJECT_TOKEN: "${{ secrets.PROJECT_TOKEN }}"
          GITHUB_TOKEN_VALUE: "${{ secrets.GITHUB_TOKEN }}"
        with:
          script: |
            const { execSync } = require("child_process");
            const pr = context.payload.pull_request;
            const branch = pr.head.ref;

            const match = branch.match(/ATLAS-(\d+)/);
            if (!match) {
              console.log("Branch does not follow ATLAS convention — skipping.");
              return;
            }

            const issueNumber = parseInt(match[1], 10);
            const base = pr.base.ref;

            // --- Gather context ---
            let issueTitle = "";
            let issueBody = "";
            try {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });
              issueTitle = issue.title;
              issueBody = issue.body || "";

              const labels = issue.labels.map((l) => l.name);
              if (labels.length > 0) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  labels: labels,
                });
              }
            } catch (e) {
              console.log("Could not fetch issue: " + e.message);
            }

            let fileStat = "";
            let diff = "";
            try {
              diff = execSync("git diff origin/" + base + "..HEAD").toString().slice(0, 8000);
              fileStat = execSync("git diff --stat origin/" + base + "..HEAD").toString().trim();
            } catch (e) {
              console.log("Could not read diff: " + e.message);
            }

            // --- Generate description with GitHub AI Models ---
            let description = "";
            try {
              const systemPrompt = [
                "You generate concise PR descriptions for a GitHub repository.",
                "Output ONLY the markdown content, no extra commentary.",
                "Use this exact format:",
                "",
                "## Scope",
                "1-2 sentences describing what this PR does and why.",
                "",
                "**Changes:**",
                "- Bullet points describing each meaningful change (3-5 bullets max)",
                "",
                "**Impact:**",
                "- List each changed file with action type and stats",
                "- Example: `path/to/file.ts` — Modified (+10, -5)",
                "",
                "Do NOT add co-author tags or attribution.",
              ].join("\n");

              const userPrompt = [
                "Generate a PR description for this pull request.",
                "",
                "PR Title: " + pr.title,
                "Branch: " + branch,
                "Linked Issue #" + issueNumber + ": " + issueTitle,
                "",
                "Issue Description:",
                issueBody.slice(0, 2000),
                "",
                "File Stats:",
                fileStat,
                "",
                "Diff (truncated):",
                diff,
              ].join("\n");

              const payload = {
                model: "openai/gpt-4o-mini",
                messages: [
                  { role: "system", content: systemPrompt },
                  { role: "user", content: userPrompt },
                ],
                temperature: 0.3,
                max_tokens: 1000,
              };

              const response = await fetch(
                "https://models.github.ai/inference/chat/completions",
                {
                  method: "POST",
                  headers: {
                    "Authorization": "Bearer " + process.env.GITHUB_TOKEN_VALUE,
                    "Content-Type": "application/json",
                  },
                  body: JSON.stringify(payload),
                }
              );

              const data = await response.json();
              if (data.choices && data.choices[0]) {
                description = data.choices[0].message.content.trim();
              }
            } catch (e) {
              console.log("AI description generation failed: " + e.message);
            }

            // Fallback if AI fails — use issue overview
            if (!description) {
              const overviewMatch = issueBody.match(/## Overview\s*\n([\s\S]*?)(?=\n##|\n- \[|$)/);
              const overview = overviewMatch ? overviewMatch[1].trim() : issueTitle;
              description = "## Scope\n" + overview;
            }

            // Append linked issue and closing keyword
            description += "\n\n## Linked Issue\n**#" + issueNumber + "** — " + issueTitle + "\n\nCloses #" + issueNumber;

            // Update PR description
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body: description,
            });

            // Auto-assign PR to the author
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              assignees: [pr.user.login],
            });

            // Add PR to ATLAS project board using PROJECT_TOKEN
            const projectToken = process.env.PROJECT_TOKEN;
            if (projectToken) {
              try {
                const { graphql } = await import("@octokit/graphql");
                const gql = graphql.defaults({
                  headers: { authorization: "token " + projectToken },
                });
                const mutation = "mutation($projectId: ID!, $contentId: ID!) { addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) { item { id } } }";
                await gql(mutation, {
                  projectId: "PVT_kwHOAovKJ84BSU4A",
                  contentId: pr.node_id,
                });
                console.log("PR added to project board.");
              } catch (e) {
                console.log("Could not add PR to project board: " + e.message);
              }
            } else {
              console.log("PROJECT_TOKEN not set — skipping project board linking.");
            }

            console.log("PR #" + pr.number + " auto-filled successfully.");

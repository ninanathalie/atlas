name: Auto-fill PR Details

# Automatically populates PR metadata when opened from an ATLAS branch.
# Links issue, assigns author, copies labels, and adds to the project board.
# PR description is generated by Copilot (enable in repo Settings > Copilot).
on:
  pull_request:
    types: [opened, reopened]

jobs:
  autofill:
    name: Auto-fill PR Metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    # Skip forked PRs — GITHUB_TOKEN is read-only for forks
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Auto-fill PR metadata from branch
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const pr = context.payload.pull_request;
            const branch = pr.head.ref;

            // Extract issue number from branch name (e.g., feat/ATLAS-07 → 7)
            const match = branch.match(/ATLAS-(\d+)/);
            if (!match) {
              console.log(`Branch '${branch}' does not follow ATLAS convention — skipping.`);
              return;
            }

            const issueNumber = parseInt(match[1], 10);

            // Append Closes keyword if not already present
            const { data: currentPr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            const body = currentPr.body || "";
            if (!body.includes(`Closes #${issueNumber}`)) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                body: body ? `${body}\n\nCloses #${issueNumber}` : `Closes #${issueNumber}`,
              });
            }

            // Auto-assign PR to the author
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              assignees: [pr.user.login],
            });

            // Copy labels from the linked issue to the PR
            try {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });

              const labels = issue.labels.map((l) => l.name);
              if (labels.length > 0) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  labels: labels,
                });
              }
            } catch (e) {
              console.log(`⚠️ Could not fetch labels from issue #${issueNumber}: ${e.message}`);
            }

            // Add PR to ATLAS project board (project #4)
            try {
              const mutation = `mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                  item { id }
                }
              }`;

              await github.graphql(mutation, {
                projectId: "PVT_kwHOAovKJ84BSU4A",
                contentId: pr.node_id,
              });
            } catch (e) {
              console.log(`⚠️ Could not add PR to project board: ${e.message}`);
            }

            console.log(`✅ PR #${pr.number} linked to issue #${issueNumber}, assigned to ${pr.user.login}, labels copied, and added to project board.`);

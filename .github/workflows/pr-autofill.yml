name: Auto-fill PR Details

# Automatically populates PR details when opened from an ATLAS branch.
# Generates description from commits and issue context, links issue,
# assigns author, copies labels, and adds to the project board.
on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  autofill:
    name: Auto-fill PR Details
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    # Skip forked PRs — GITHUB_TOKEN is read-only for forks
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Auto-fill PR details from branch
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        with:
          script: |
            const { execSync } = require("child_process");
            const pr = context.payload.pull_request;
            const branch = pr.head.ref;

            // Extract issue number from branch name (e.g., feat/ATLAS-07 → 7)
            const match = branch.match(/ATLAS-(\d+)/);
            if (!match) {
              console.log(`Branch '${branch}' does not follow ATLAS convention — skipping.`);
              return;
            }

            const issueNumber = parseInt(match[1], 10);

            // --- Generate PR description from commits and issue ---
            let description = "";

            // Get commit messages for this PR
            let commits = "";
            try {
              const base = pr.base.ref;
              commits = execSync(
                `git log origin/${base}..HEAD --pretty=format:"- %s" --reverse`
              ).toString().trim();
            } catch (e) {
              console.log("⚠️ Could not read commit log:", e.message);
            }

            // Get linked issue details and build scope summary
            let issueTitle = "";
            try {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });

              issueTitle = issue.title;

              // Copy labels from issue to PR
              const labels = issue.labels.map((l) => l.name);
              if (labels.length > 0) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  labels: labels,
                });
              }
            } catch (e) {
              console.log(`⚠️ Could not fetch issue #${issueNumber}: ${e.message}`);
            }

            // Build scope section with summary sentence and change bullets
            const commitLines = commits.split("\n").filter(Boolean);
            const changeBullets = commitLines
              .map((line) => {
                // Remove the "- " prefix and any type(scope): prefix
                return line.replace(/^- /, "").replace(/^[a-z]+(\([^)]*\))?:\s*/i, "");
              })
              .filter((line, index, self) => self.indexOf(line) === index) // dedupe
              .slice(0, 5) // max 5 bullets
              .map((line) => `- ${line.charAt(0).toUpperCase() + line.slice(1)}`);

            // Generate a summary sentence from the PR title and issue
            const prTitle = pr.title.replace(/^[a-z]+(\([^)]*\))?:\s*/i, "");
            const summary = issueTitle
              ? `This PR addresses #${issueNumber} (${issueTitle}). ${prTitle.charAt(0).toUpperCase() + prTitle.slice(1)}.`
              : `${prTitle.charAt(0).toUpperCase() + prTitle.slice(1)}.`;

            description += `## Scope\n${summary}\n\n`;
            if (changeBullets.length > 0) {
              description += `**Changes:**\n${changeBullets.join("\n")}\n\n`;
            }

            description += `## Linked Issue\n**#${issueNumber}** — ${issueTitle}\n\n`;

            description += `Closes #${issueNumber}`;

            // Update PR description
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              body: description,
            });

            // Auto-assign PR to the author
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              assignees: [pr.user.login],
            });

            // Add PR to ATLAS project board (project #4) using PROJECT_TOKEN
            const projectToken = process.env.PROJECT_TOKEN;
            if (projectToken) {
              try {
                const { Octokit } = await import("@octokit/rest");
                const { graphql } = await import("@octokit/graphql");

                const gql = graphql.defaults({
                  headers: { authorization: `token ${projectToken}` },
                });

                await gql(`mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                    item { id }
                  }
                }`, {
                  projectId: "PVT_kwHOAovKJ84BSU4A",
                  contentId: pr.node_id,
                });

                console.log("✅ PR added to project board.");
              } catch (e) {
                console.log(`⚠️ Could not add PR to project board: ${e.message}`);
              }
            } else {
              console.log("⚠️ PROJECT_TOKEN not set — skipping project board linking.");
            }

            console.log(`✅ PR #${pr.number} auto-filled: description generated, linked to #${issueNumber}, assigned to ${pr.user.login}.`);

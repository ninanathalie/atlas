name: Auto-fill PR Details

# Automatically populates PR details when opened from an ATLAS branch.
# Generates description from issue context and commits, links issue,
# assigns author, copies labels, and adds to the project board.
#
# Behavior by event:
#   opened/reopened — generate description, assign, label, link project
#   synchronize     — regenerate description (if previously auto-generated)
on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  autofill:
    name: Auto-fill PR Details
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    # Skip forked PRs — GITHUB_TOKEN is read-only for forks
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      # ── Step 1: Generate description and fill metadata ──
      - name: Generate description and fill metadata
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const pr = context.payload.pull_request;
            const branch = pr.head.ref;
            const action = context.payload.action;
            const AUTO_MARKER = "<!-- auto-generated-pr-description -->";

            // ── Extract issue number from branch name ──
            const match = branch.match(/ATLAS-(\d+)/);
            if (!match) {
              console.log("Branch does not follow ATLAS convention — skipping.");
              return;
            }
            const issueNumber = parseInt(match[1], 10);

            // ── Fetch linked issue ──
            let issueTitle = "";
            let issueBody = "";
            let issueLabels = [];
            let issueFetched = false;
            try {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });
              issueTitle = issue.title;
              issueBody = issue.body || "";
              issueLabels = issue.labels.map((l) => l.name);
              issueFetched = true;
            } catch (e) {
              console.log("Could not fetch issue #" + issueNumber + ": " + e.message);
            }

            // ── Determine if we should generate the description ──
            const currentBody = (pr.body || "").trim();
            const wasAutoGenerated = currentBody.includes(AUTO_MARKER);
            const shouldGenerate = currentBody === "" || wasAutoGenerated;

            // ── Generate PR description (if applicable) ──
            if (shouldGenerate) {
              // Scope — from issue overview → issue title → PR title → fallback
              const overviewMatch = issueBody.match(/## Overview\s*\n([\s\S]*?)(?=\n##|\n- \[|$)/);
              let scope = overviewMatch ? overviewMatch[1].trim() : (issueTitle || "");
              if (!scope) {
                scope = pr.title && pr.title.trim() !== "" ? pr.title : "Issue #" + issueNumber;
              }

              // Changes — from PR commit messages via API
              let changeBullets = [];
              try {
                const commits = await github.paginate(github.rest.pulls.listCommits, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  per_page: 100,
                });

                changeBullets = commits
                  .map((c) => c.commit.message.split("\n")[0])
                  .filter((msg) => !msg.startsWith("Merge"))
                  .map((msg) => msg.replace(/^[a-z]+(\([^)]*\))?:\s*/i, ""))
                  .filter((msg, i, arr) => arr.indexOf(msg) === i)
                  .slice(0, 5)
                  .map((msg) => "- " + msg.charAt(0).toUpperCase() + msg.slice(1));
              } catch (e) {
                console.log("Could not fetch commits: " + e.message);
              }

              // Impact — from changed files via API
              let impactLines = [];
              try {
                const files = await github.paginate(github.rest.pulls.listFiles, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  per_page: 100,
                });

                impactLines = files.map((f) => {
                  const status = f.status.charAt(0).toUpperCase() + f.status.slice(1);
                  return "- `" + f.filename + "` — " + status + " (+" + f.additions + ", -" + f.deletions + ")";
                });
              } catch (e) {
                console.log("Could not fetch PR files: " + e.message);
              }

              // Assemble description
              const sections = [AUTO_MARKER, "## Scope", scope];

              if (changeBullets.length > 0) {
                sections.push("", "**Changes:**", changeBullets.join("\n"));
              }

              if (impactLines.length > 0) {
                sections.push("", "**Impact:**", impactLines.join("\n"));
              }

              // Linked issue — only auto-close if issue was verified
              if (issueFetched) {
                sections.push(
                  "",
                  "## Linked Issue",
                  "**#" + issueNumber + "** — " + issueTitle,
                  "",
                  "Closes #" + issueNumber
                );
              } else {
                sections.push(
                  "",
                  "## Linked Issue (unverified)",
                  "Potentially related issue: **#" + issueNumber + "**",
                  "",
                  "_Issue details could not be retrieved. Please verify and link manually._"
                );
              }

              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                body: sections.join("\n"),
              });

              console.log("PR description generated.");
            } else {
              // Manual description — only append Closes if missing and issue was verified
              if (issueFetched && !currentBody.includes("Closes #" + issueNumber)) {
                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  body: currentBody + "\n\nCloses #" + issueNumber,
                });
              }
              console.log("Manual description preserved.");
            }

            // ── Metadata (always on opened/reopened, regardless of description) ──
            if (action !== "synchronize") {
              // Assign PR to author
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                assignees: [pr.user.login],
              });

              // Copy labels from issue
              if (issueLabels.length > 0) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  labels: issueLabels,
                });
              }
            }

            console.log("PR #" + pr.number + " auto-filled (" + action + ").");

      # ── Step 2: Project board linking (separate step with PAT) ──
      - name: Add PR to project board
        if: github.event.action != 'synchronize'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        with:
          script: |
            const projectToken = process.env.PROJECT_TOKEN;
            if (!projectToken) {
              console.log("PROJECT_TOKEN not set — skipping project board linking.");
              return;
            }

            try {
              const { graphql } = require("@octokit/graphql");
              const gql = graphql.defaults({
                headers: { authorization: "token " + projectToken },
              });

              await gql(
                "mutation($projectId: ID!, $contentId: ID!) { addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) { item { id } } }",
                {
                  projectId: "PVT_kwHOAovKJ84BSU4A",
                  contentId: context.payload.pull_request.node_id,
                }
              );
              console.log("PR added to project board.");
            } catch (e) {
              console.log("Could not add PR to project board: " + e.message);
            }

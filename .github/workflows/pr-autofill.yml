name: Auto-fill PR Details

# Automatically populates PR details when opened from an ATLAS branch.
# Generates description from issue context and commits, links issue,
# assigns author, copies labels, and adds to the project board.
#
# Behavior by event:
#   opened/reopened — generate description, assign, label, link project
#   synchronize     — regenerate description only (if previously auto-generated)
on:
  pull_request:
    types: [opened, reopened, synchronize]

env:
  PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}

jobs:
  autofill:
    name: Auto-fill PR Details
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    # Skip forked PRs — GITHUB_TOKEN is read-only for forks
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Generate description and fill metadata
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const pr = context.payload.pull_request;
            const branch = pr.head.ref;
            const action = context.payload.action;
            const AUTO_MARKER = "<!-- auto-generated-pr-description -->";

            // ── Extract issue number from branch name ──
            const match = branch.match(/ATLAS-(\d+)/);
            if (!match) {
              console.log("Branch does not follow ATLAS convention — skipping.");
              return;
            }
            const issueNumber = parseInt(match[1], 10);

            // ── Fetch linked issue ──
            let issueTitle = "";
            let issueBody = "";
            let issueLabels = [];
            try {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });
              issueTitle = issue.title;
              issueBody = issue.body || "";
              issueLabels = issue.labels.map((l) => l.name);
            } catch (e) {
              console.log("Could not fetch issue #" + issueNumber + ": " + e.message);
            }

            // ── Determine if we should generate the description ──
            const currentBody = (pr.body || "").trim();
            const wasAutoGenerated = currentBody.includes(AUTO_MARKER);

            // Detect if body is just the PR template (untouched by user)
            let isUnmodifiedTemplate = false;
            try {
              const { data: template } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: ".github/pull_request_template.md",
              });
              const templateContent = Buffer.from(template.content, "base64").toString().trim();
              isUnmodifiedTemplate = currentBody === templateContent;
            } catch (e) {
              // No template file — not an issue
            }

            const shouldGenerate =
              currentBody === ""          ||  // empty body
              wasAutoGenerated            ||  // previously auto-generated
              isUnmodifiedTemplate;            // untouched PR template

            // On synchronize with manual description — only append Closes keyword
            if (action === "synchronize" && !shouldGenerate) {
              console.log("Manual description detected — skipping regeneration.");
              return;
            }

            // ── Generate PR description ──
            if (shouldGenerate) {
              // Scope — from issue overview or title
              const overviewMatch = issueBody.match(/## Overview\s*\n([\s\S]*?)(?=\n##|\n- \[|$)/);
              const scope = overviewMatch ? overviewMatch[1].trim() : issueTitle;

              // Changes — from commit messages
              let changeBullets = [];
              try {
                const commits = await github.paginate(github.rest.pulls.listCommits, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  per_page: 100,
                });

                changeBullets = commits
                  .map((c) => c.commit.message.split("\n")[0])
                  .filter((msg) => !msg.startsWith("Merge"))
                  .map((msg) => msg.replace(/^[a-z]+(\([^)]*\))?:\s*/i, ""))
                  .filter((msg, i, arr) => arr.indexOf(msg) === i)
                  .slice(0, 5)
                  .map((msg) => "- " + msg.charAt(0).toUpperCase() + msg.slice(1));
              } catch (e) {
                console.log("Could not fetch commits: " + e.message);
              }

              // Impact — from changed files
              let impactLines = [];
              try {
                const files = await github.paginate(github.rest.pulls.listFiles, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  per_page: 100,
                });

                impactLines = files.map((f) => {
                  const status = f.status.charAt(0).toUpperCase() + f.status.slice(1);
                  return "- `" + f.filename + "` — " + status + " (+" + f.additions + ", -" + f.deletions + ")";
                });
              } catch (e) {
                console.log("Could not fetch PR files: " + e.message);
              }

              // Assemble description
              const sections = [AUTO_MARKER, "## Scope", scope];

              if (changeBullets.length > 0) {
                sections.push("", "**Changes:**", changeBullets.join("\n"));
              }

              if (impactLines.length > 0) {
                sections.push("", "**Impact:**", impactLines.join("\n"));
              }

              sections.push(
                "",
                "## Linked Issue",
                "**#" + issueNumber + "** — " + issueTitle,
                "",
                "Closes #" + issueNumber
              );

              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                body: sections.join("\n"),
              });

              console.log("PR description generated.");
            } else {
              // Manual description — only append Closes if missing
              if (!currentBody.includes("Closes #" + issueNumber)) {
                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  body: currentBody + "\n\nCloses #" + issueNumber,
                });
              }
              console.log("Manual description preserved — appended Closes keyword.");
            }

            // ── Metadata (only on opened/reopened) ──
            if (action !== "synchronize") {
              // Assign PR to author
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                assignees: [pr.user.login],
              });

              // Copy labels from issue
              if (issueLabels.length > 0) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  labels: issueLabels,
                });
              }
            }

            console.log("PR #" + pr.number + " auto-filled (" + action + ").");

      # ── Project board linking (requires PAT with project scope) ──
      - name: Add PR to project board
        if: env.PROJECT_TOKEN != ''
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            // Only link to project on open/reopen
            if (context.payload.action === "synchronize") return;

            try {
              await github.graphql(
                `mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                    item { id }
                  }
                }`,
                {
                  projectId: "PVT_kwHOAovKJ84BSU4A",
                  contentId: context.payload.pull_request.node_id,
                }
              );
              console.log("PR added to project board.");
            } catch (e) {
              console.log("Could not add PR to project board: " + e.message);
            }

name: E2E Tests

# Runs Playwright end-to-end tests on every pull request.
on:
 pull_request:
  branches:
   - develop
   - master

permissions:
 contents: read

jobs:
 e2e:
  name: Playwright Tests
  runs-on: ubuntu-latest
  timeout-minutes: 15

  # Skip forked PRs and Dependabot — secrets may not be available
  if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'

  env:
   DATABASE_URL: ${{ secrets.DATABASE_URL }}
   NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
   NEXTAUTH_URL: http://localhost:3000

  steps:
   - name: Checkout
     uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

   - name: Setup Node.js
     uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
     with:
      node-version: 22
      cache: npm

   - name: Install dependencies
     run: npm ci

   - name: Generate Prisma client
     run: npx prisma generate

   - name: Install Playwright browsers
     run: npx playwright install --with-deps chromium

   - name: Run Playwright tests
     run: npx playwright test

   - name: Upload test results
     if: ${{ !cancelled() }}
     uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
     with:
      name: playwright-report
      path: playwright-report/
      retention-days: 7

name: CI

# Runs on every pull request targeting develop or master.
# Branch protection rules require this workflow to pass before merging.
on:
  pull_request:
    branches:
      - develop
      - master

permissions:
  contents: read

jobs:
  ci:
    name: Type Check, Lint & Build
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the code
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # 2. Set up Node.js — matches the project's Node version
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      # 3. Install dependencies (clean install, uses package-lock.json)
      - name: Install dependencies
        run: npm ci

      # 4. TypeScript type check — catches type errors without compiling
      - name: Type check
        run: npx tsc --noEmit

      # 5. ESLint — catches lint errors, fails on warnings
      - name: Lint
        run: npx eslint . --max-warnings=0

      # 6. Next.js production build — confirms the app actually compiles
      - name: Build
        run: npm run build

name: CI

# Runs on every pull request targeting develop or master.
# Branch protection rules require this workflow to pass before merging.
on:
  pull_request:
    branches:
      - develop
      - master

permissions:
  contents: read

jobs:
  ci:
    name: Test, Type Check, Lint & Build
    runs-on: ubuntu-latest

    env:
      # Fallback values for Dependabot PRs (can't access secrets).
      # These allow the build to compile but never connect to a real database.
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://placeholder:placeholder@localhost:5432/placeholder' }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-placeholder-secret' }}
      NEXTAUTH_URL: http://localhost:3000

    steps:
      # 1. Check out the code
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # 2. Set up Node.js — matches the project's Node version
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies (clean install, uses package-lock.json)
      - name: Install dependencies
        run: npm ci

      # 4. Generate Prisma client (required before type-check and build)
      - name: Generate Prisma client
        run: npx prisma generate

      # 5. Run unit tests
      - name: Test
        run: npm test

      # 6. TypeScript type check — catches type errors without compiling
      - name: Type check
        run: npx tsc --noEmit

      # 7. ESLint — catches lint errors, fails on warnings
      - name: Lint
        run: npx eslint . --max-warnings=0 --no-warn-ignored

      # 8. Next.js production build — confirms the app actually compiles
      - name: Build
        run: npm run build

name: Stale Issues and PRs

# Automatically marks inactive issues and PRs as stale,
# then closes them after a grace period.
on:
  schedule:
    # Runs daily at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Check for Stale Items
    runs-on: ubuntu-latest

    steps:
      - name: Mark and close stale items
        uses: actions/stale@eb5cf3af3ac0a1aa4c9c45633dd1ae542a27a899 # v10.3.0
        with:
          # Issues
          stale-issue-message: "This issue has been inactive for 30 days and has been marked as stale. It will be closed in 7 days if there is no further activity."
          close-issue-message: "This issue has been closed due to inactivity. Feel free to reopen if still relevant."
          days-before-issue-stale: 30
          days-before-issue-close: 7
          stale-issue-label: "stale"
          exempt-issue-labels: "ready-for-dev,approved-for-publish"

          # Pull requests
          stale-pr-message: "This PR has been inactive for 14 days and has been marked as stale. It will be closed in 7 days if there is no further activity."
          close-pr-message: "This PR has been closed due to inactivity."
          days-before-pr-stale: 14
          days-before-pr-close: 7
          stale-pr-label: "stale"

name: Branch Naming Enforcement

# Validates that PR branch names follow the required naming convention.
# Required format: {type}/ATLAS-{issue number} (e.g., feat/ATLAS-09)
on:
  pull_request:
    branches:
      - develop
      - master

permissions:
  contents: read

jobs:
  check-branch-name:
    name: Validate Branch Name
    runs-on: ubuntu-latest

    steps:
      - name: Check branch naming convention
        run: |
          BRANCH="${{ github.head_ref }}"

          # Skip validation for base branches
          if [[ "$BRANCH" == "develop" || "$BRANCH" == "master" ]]; then
            echo "✅ Base branch '$BRANCH' — skipping validation."
            exit 0
          fi

          # Required format: {type}/ATLAS-{number}
          PATTERN='^(feat|fix|hotfix|chore|docs|refactor|test)/ATLAS-[0-9]+$'

          if [[ ! "$BRANCH" =~ $PATTERN ]]; then
            echo ""
            echo "❌ Branch name '$BRANCH' does not follow the naming convention."
            echo ""
            echo "   Required format: {type}/ATLAS-{issue number}"
            echo "   Allowed types:   feat, fix, hotfix, chore, docs, refactor, test"
            echo "   Example:         feat/ATLAS-09"
            echo ""
            exit 1
          fi

          echo "✅ Branch name '$BRANCH' is valid."
